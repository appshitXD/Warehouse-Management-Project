<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#fafafa" />
    <title>Warehouse · Warehouse Management</title>
    <link rel="stylesheet" href="styles/main.css" />
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <button
      id="navigation-backdrop"
      class="navigation-backdrop"
      aria-label="Close navigation"
      tabindex="-1"
      hidden
    ></button>
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <a class="brand" href="#dashboard">
          <span class="brand-icon" aria-hidden="true"
            ><svg
              class="ui-icon"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.7"
            >
              <path d="m3 9 9-6 9 6v12H3V9ZM7 21v-8h10v8M7 17h10" /></svg
          ></span>
          <span class="brand-text">warehouse.</span>
        </a>
        <button
          type="button"
          id="sidebar-toggle"
          aria-controls="sidebar"
          aria-expanded="true"
          class="sidebar-toggle-btn"
          aria-label="Collapse sidebar"
        >
          <svg
            aria-hidden="true"
            width="16"
            height="16"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M15 18l-6-6 6-6" />
          </svg>
        </button>
      </div>
      <div class="workspace">
        <span class="workspace-icon">W</span>
        <div class="workspace-text"><strong>Warehouse Management</strong></div>
      </div>

      <nav id="navigation" aria-label="Main navigation"></nav>
      <div class="sidebar-bottom">
        <span class="status-dot"></span>
        <div class="sidebar-bottom-text">
          <strong>Local data</strong><small>Saved in this browser</small>
        </div>
      </div>
    </aside>
    <div class="shell">
      <header class="topbar">
        <button
          type="button"
          id="mobile-navigation"
          class="icon-button"
          aria-label="Open navigation"
          aria-controls="sidebar"
          aria-expanded="false"
        >
          <svg
            class="ui-icon"
            aria-hidden="true"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <path d="M4 6h16M4 12h16M4 18h16" />
          </svg>
        </button>
        <div class="breadcrumb">
          Workspace <span>/</span> <strong id="breadcrumb">Overview</strong>
        </div>
        <div class="topbar-right">
          <span class="shell-label">Warehouse Management</span>
        </div>
      </header>
      <main id="main" tabindex="-1"></main>
    </div>
    <dialog id="form-dialog" aria-labelledby="dialog-title">
      <form id="operation-form" novalidate>
        <div class="dialog-heading">
          <div>
            <p class="eyebrow">WAREHOUSE MANAGEMENT</p>
            <h2 id="dialog-title"></h2>
          </div>
          <button
            type="button"
            class="icon-button"
            id="close-dialog"
            aria-label="Close"
          >
            ×
          </button>
        </div>
        <div class="dialog-content">
          <div
            id="form-error-summary"
            class="error-summary"
            tabindex="-1"
            hidden
          ></div>
          <div id="form-fields"></div>
          <p class="form-error" id="form-error" role="alert"></p>
        </div>
        <div class="dialog-actions">
          <button type="button" class="button secondary" id="cancel-dialog">
            Cancel</button
          ><button type="submit" class="button primary" id="submit-operation">
            Save
          </button>
        </div>
      </form>
    </dialog>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <script type="module" src="src/main.js"></script>
  </body>
</html>
