spring.application.name=warehouse

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/warehouse_db}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.sql.init.mode=never

# Frontend origins allowed to call /api/** from the browser (comma-separated)
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

# Reject decimals for integer fields (e.g. reorderLevel 12.5) instead of silently truncating to 12
spring.jackson.deserialization.accept-float-as-int=false
